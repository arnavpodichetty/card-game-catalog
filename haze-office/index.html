<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Haze Office</title>
  <meta name="description" content="Name the film from a blurred poster. A new one every day, two ways to play, and an archive of every past puzzle." />
  <meta name="theme-color" content="#e4e6e0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#18191c" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M3 8h26v5a3 3 0 0 0 0 6v5H3v-5a3 3 0 0 0 0-6z' fill='%23c3261f'/%3E%3Cpath d='M21 9v14' stroke='%23fff' stroke-width='1.5' stroke-dasharray='2 2'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Libre+Franklin:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="nav">
    <div class="nav__inner">
      <a class="brand" href="#/" aria-label="Haze Office, home">
        <svg class="brand__mark" viewBox="0 0 32 22" aria-hidden="true"><path d="M1 1h30v6a4 4 0 0 0 0 8v6H1v-6a4 4 0 0 0 0-8z"/><path class="brand__perf" d="M22 3v16"/></svg>
        <span class="brand__name">Haze Office</span>
      </a>
      <nav class="nav__links" aria-label="Main">
        <a href="#/" data-nav="today">Today</a>
        <a href="#/archive" data-nav="archive">Archive</a>
        <button class="icon-btn" id="statsBtn" aria-label="Your stats">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
        </button>
        <button class="icon-btn" id="helpBtn" aria-label="How to play">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .9-1 1.6v.4M12 17h.01"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main id="app"></main>

  <footer class="foot">
    <p>Poster images from TMDB. This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
  </footer>

  <dialog id="modal" class="modal">
    <button class="modal__x" data-close aria-label="Close">×</button>
    <div id="modalBody"></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="movies.js"></script>
  <script src="posters.js"></script>
  <script src="app.js"></script>
</body>
</html>
