<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Haze Office</title>
  <meta name="description" content="Name the film from a blurred poster. Two new posters every day, and an archive of every past puzzle." />
  <meta name="theme-color" content="#f3f3f0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 32'%3E%3Cdefs%3E%3Cfilter id='b'%3E%3CfeGaussianBlur stdDeviation='2.2'/%3E%3C/filter%3E%3C/defs%3E%3Crect width='24' height='32' fill='%23111315'/%3E%3Ccircle cx='12' cy='14' r='6' fill='%23f3f3f0' filter='url(%23b)'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
  <link rel="preconnect" href="https://api.themoviedb.org" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="nav">
    <div class="nav__inner">
      <a class="brand" href="#/" aria-label="Haze Office, home">
        <svg class="brand__mark" viewBox="0 0 24 32" aria-hidden="true">
          <defs><filter id="haze" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" /></filter></defs>
          <rect class="brand__card" width="24" height="32" />
          <circle class="brand__sun" cx="12" cy="14" r="6" filter="url(#haze)" />
        </svg>
        <span class="brand__name">Haze Office</span>
      </a>
      <nav class="nav__links" aria-label="Main">
        <a href="#/" data-nav="today">Today</a>
        <a href="#/archive" data-nav="archive">Archive</a>
        <button id="statsBtn">Stats</button>
        <button id="helpBtn" aria-label="How to play">Help</button>
      </nav>
    </div>
  </header>

  <main id="app"></main>

  <footer class="foot">
    <div class="foot__inner">
      <span class="brand__name brand__name--sm">Haze Office</span>
      <p>Film data and posters from <a href="https://www.themoviedb.org/" rel="noopener">TMDB</a>. This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
    </div>
  </footer>

  <dialog id="modal" class="modal">
    <button class="modal__x" data-close aria-label="Close">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15" /></svg>
    </button>
    <div id="modalBody"></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="movies.js"></script>
  <script src="posters.js"></script>
  <script src="app.js"></script>
</body>
</html>
