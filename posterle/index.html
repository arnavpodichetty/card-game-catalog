<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Posterle — the daily movie poster game</title>
  <meta name="description" content="Name the film from a blurred poster. A new one every day, two ways to play, plus an archive of every past puzzle." />
  <meta name="theme-color" content="#0f0e0d" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='3' width='18' height='26' rx='2.5' fill='%23d6a84f'/%3E%3Crect x='10' y='6' width='12' height='14' rx='1' fill='%230f0e0d' opacity='.55'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="nav">
    <div class="nav__inner">
      <a class="brand" href="#/" aria-label="Posterle home">
        <svg class="brand__mark" viewBox="0 0 20 28" aria-hidden="true"><rect x="1" y="1" width="18" height="26" rx="2.5"/><rect class="brand__hole" x="4" y="4" width="12" height="13" rx="1"/></svg>
        <span class="brand__name">Posterle</span>
      </a>
      <div class="nav__links">
        <a href="#/" data-nav="today">Today</a>
        <a href="#/archive" data-nav="archive">Archive</a>
        <button class="icon-btn" id="statsBtn" aria-label="Statistics">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
        </button>
        <button class="icon-btn" id="helpBtn" aria-label="How to play">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .9-1 1.6v.4M12 17h.01"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <main id="app"></main>

  <footer class="foot">Posters via TMDB or Wikipedia, for identification only. Posterle is a fan-made game.</footer>

  <dialog id="modal" class="modal">
    <button class="modal__x" data-close aria-label="Close">×</button>
    <div id="modalBody"></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="movies.js"></script>
  <script src="posters.js"></script>
  <script src="app.js"></script>
</body>
</html>
